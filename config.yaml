# run configuration. this file is the methods-section record: pin everything here, not in code.

run:
  languages: [en, fr, zh]
  retrievers: [native]    # main design: each vendor's own search api ("what users get").
                          # add "common" to also run the openrouter + exa condition (clients/openrouter.py, kept but off)
  conditions: [default]   # add "cite" to run the robustness arm below
  shuffle_order: true
  seed: 540
  output_dir: data/raw

models:
  # name: short label used in logs
  # origin: US | FR | CN
  # openrouter_id: model slug on OpenRouter (common retriever)
  # openrouter_provider: provider slug on OpenRouter, pinned with fallbacks off (vendor itself where offered; verify slugs on each model's Providers tab)
  # native: the vendor's own API + search tool (native retriever). must be the same model as openrouter_id
  # TODO: fill native.model ids from each vendor's docs; confirm each supports the vendor's search tool
  - name: gpt
    origin: US
    openrouter_id: openai/gpt-6.1-sol
    openrouter_provider: openai
    native: {api: openai, model: gpt-6.1-sol, tool: web_search, tool_choice: auto}  # model id assumed = openrouter slug minus prefix; verify
  - name: claude
    origin: US
    openrouter_id: anthropic/claude-sonnet-5.5
    openrouter_provider: anthropic
    native: {api: anthropic, model: claude-sonnet-5-5, tool: web_search_20250305, max_uses: 5}
  - name: gemini
    origin: US
    openrouter_id: google/gemini-3.8-flash
    openrouter_provider: google-ai-studio
    native: {api: google, model: gemini-3.8-flash, tool: google_search}  # interactions api; cited urls only, may be redirect links
  - name: mistral
    origin: FR
    openrouter_id: mistralai/mistral-large-4-0
    openrouter_provider: mistral
    native: {api: mistral, model: mistral-large-latest, tool: web_search}  # conversations api (beta). TEMP alias: replace with the dated id smoke_test logs as model_returned; only cited urls exposed
  - name: qwen
    origin: CN
    openrouter_id: qwen/qwen3.8-max-0902
    openrouter_provider: alibaba
    native: {api: dashscope, model: qwen3.8-max-0902, tool: web_search, base_url: "https://ap-southeast-1.maas.qwencloudapi.com/compatible-mode/v1"}  # responses api, intl endpoint
  - name: deepseek
    origin: CN
    openrouter_id: deepseek/deepseek-v4-pro-0813
    openrouter_provider: deepseek  # TODO: confirm DeepSeek is listed as a provider; if not, note as limitation
    native: {api: deepseek, model: deepseek-v4-pro, tool: web_search_20250305, max_uses: 5}  # anthropic-format endpoint; deepseek-v4-pro = DeepSeek-V4-Pro-0813

retrievers:
  common:
    via: openrouter          # responses api + openrouter:web_search server tool
    engine: exa              # forced for all models, including those with native search
    mode: auto               # exa search mode, pinned
    max_results: 10          # per search call
    max_uses: 5              # searches per request, same cap as claude/deepseek native
  native:
    via: provider_api

generation:
  temperature: null      # null = provider default; report actual value used

# prompt conditions. each job runs under one; the condition is part of its job_id.
conditions:
  default:               # primary: bare api call, no instruction
    system_prompt: null
    reps: 3
  cite:                  # robustness arm: same question + a uniform citation instruction.
    system_prompt: "Cite your sources inline as links."   # measures how much asking for citations
    reps: 1                                              # changes visibility; recovers deepseek citations
